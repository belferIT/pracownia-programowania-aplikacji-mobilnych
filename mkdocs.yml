site_name: Pracownia programowania aplikacji mobilnych – INF.04
site_description: Materiały do lekcji z przedmiotu Pracownia programowania aplikacji mobilnych (technikum, klasa IV, .NET MAUI)
site_author: Marcin Wojciechowski
site_url: https://belferit.github.io/pracownia-programowania-aplikacji-mobilnych/
repo_url: https://github.com/belferit/pracownia-programowania-aplikacji-mobilnych

theme:
  name: material
  language: pl
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: deep purple
      accent: orange
      toggle:
        icon: material/weather-night
        name: Tryb ciemny
    - scheme: slate
      primary: deep purple
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark

nav:
  - Start: index.md
  - Rozkład materiału: rozklad.md
  - Start:
      - "O dziale": start/index.md
      - "1. BHP i organizacja pracy. Visual Studio 2026 z .NET MAUI": start/lekcja-01.md
      - "2. Pierwsza aplikacja .NET MAUI": start/lekcja-02.md
      - "3. Emulator Androida i dokumentowanie uruchomienia": start/lekcja-03.md
  - XAML i układy:
